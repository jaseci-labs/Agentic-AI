name: Deploy JAC-GPT Fullstack with jac-scale

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-jac-gpt-fullstack:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/jac-gpt-') || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Configure AWS credentials using OIDC
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4.2.0
        with:
          aws-region: us-east-2
          role-to-assume: arn:aws:iam::776241927220:role/GitHubActionsJaseciDeployRole
          role-session-name: GitHubActions-JacGPT
          audience: sts.amazonaws.com

      # Update kubeconfig to connect to EKS cluster
      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig --region us-east-2 --name jaseci-cluster
          kubectl config current-context

      # Set up Python
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # jaclang ships as a self-contained `jac` binary. Under jaseci#7084,
      # `jac start --scale` ships this same binary to the pods over a
      # ReadWriteMany bundle PVC -- no source clone, no code-server, no
      # --experimental. Pinned to stable v0.31.3: it carries the #7084 deploy
      # redesign, predates the #7376 breaking change, and `jac check` passes.
      # Download the latest STABLE jac binary -- it MUST match the runtime the
      # pods use (`jac start --scale` ships the 'stable' binary to pods), so the
      # runner seals the app with the same jac the pods run. The app is migrated
      # to v0.32.x grammar (#7376 parenthesized lambdas); older jac would reject it.
      - name: Install jac binary (latest stable -- matches the pod runtime)
        run: |
          mkdir -p "$HOME/.jacbin"
          rel=$(curl -fsSL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/jaseci-labs/jaseci/releases/latest)
          asset_url=$(echo "$rel" | jq -r '.assets[] | select(.name | test("^jac-[0-9].*-linux-x86_64$")) | .browser_download_url')
          test -n "$asset_url" || { echo "ERROR: no linux-x86_64 asset on latest stable"; exit 1; }
          echo "Latest stable: $(echo "$rel" | jq -r .tag_name)"
          curl -fsSL -o "$HOME/.jacbin/jac" "$asset_url"
          curl -fsSL -o "$HOME/.jacbin/jac.sha256" "${asset_url}.sha256"
          ( cd "$HOME/.jacbin" && echo "$(cut -d' ' -f1 jac.sha256)  jac" | sha256sum -c - )
          chmod +x "$HOME/.jacbin/jac"
          echo "$HOME/.jacbin" >> "$GITHUB_PATH"
          export PATH="$HOME/.jacbin:$PATH"
          jac --version

      # Install app deps. The .jab seal resolves the app's Python imports from
      # the GLOBAL jac site (the client compile pulls in server modules like
      # rag_engine -> langchain/sentence-transformers), so the heavy deps must be
      # installed --global too, or the seal skips those modules ("Seal incomplete").
      - name: Install app dependencies
        run: |
          jac install
          jac install --global \
            python-dotenv requests numpy \
            langchain-openai langchain-community langchain-chroma \
            langchain-text-splitters langchain-core pypdf \
            sentence-transformers faiss-cpu
        working-directory: jac-gpt-fullstack

      # Deploy using jac-scale (secrets from env via [scale.secrets]).
      # The binary is shipped to pods over the RWX bundle PVC (bundle_storage_class).
      - name: Deploy JAC-GPT Fullstack with jac-scale
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          jac start main.jac --scale
        working-directory: jac-gpt-fullstack

      # Get deployment status
      - name: Verify deployment
        run: |
          echo "Checking deployment status..."
          kubectl get deployments -n jac-gpt-test
          kubectl get services -n jac-gpt-test
          kubectl get pods -n jac-gpt-test

      # Output deployment summary
      - name: Deployment Summary
        if: always()
        run: |
          echo "## JAC-GPT Fullstack Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "### Configuration" >> $GITHUB_STEP_SUMMARY
          echo "- **App Name**: jac-gpt-test" >> $GITHUB_STEP_SUMMARY
          echo "- **Namespace**: jac-gpt-test" >> $GITHUB_STEP_SUMMARY
          echo "- **Cluster**: jaseci-cluster" >> $GITHUB_STEP_SUMMARY
          echo "- **Region**: us-east-2" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered By**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "- **Release Tag**: ${{ github.event.release.tag_name }}" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Deployment Status" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          kubectl get all -n jac-gpt-test 2>&1 >> $GITHUB_STEP_SUMMARY || echo "Unable to fetch deployment status" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
