[project]
name = "jac-gpt-client"
version = "1.0.0"
description = "Jac client application: jac-gpt-client"
entry-point = "main.jac"

[dependencies]
python-dotenv = ">=0.0.0"
requests = ">=0.0.0"
langchain-openai = ">=0.0.0"
langchain-community = ">=0.0.0"
langchain-chroma = ">=0.0.0"
pypdf = ">=0.0.0"
sentence-transformers = ">=0.0.0"
faiss-cpu = ">=0.0.0"
numpy = "~=2.5"

[dependencies.npm]
jac-client-node = "1.0.7"
"@tanstack/react-form" = "^1.33.0"
react-markdown = "^9.0.0"
rehype-highlight = "^7.0.0"
"highlight.js" = "^11.9.0"
clsx = "^2.1.0"
tailwind-merge = "^2.2.0"
"@mantine/core" = "^7.15.0"
"@mantine/hooks" = "^7.15.0"
"@tabler/icons-react" = "^3.28.0"
"@emotion/react" = "^11.14.0"
react-error-boundary = "latest"
"@codemirror/view" = "^6.0.0"
"@codemirror/state" = "^6.0.0"
"@codemirror/language" = "^6.0.0"
"@lezer/highlight" = "^1.0.0"
monaco-textmate = "^3.0.1"
monaco-editor-textmate = "^4.0.0"

[dependencies.npm.dev]
"@jac-client/dev-deps" = "1.0.0"

[dev-dependencies]
watchdog = ">=3.0.0"

[serve]
base_route_app = "app"

[plugins.client]

# Bare [dev] table -> pods run the same rolling `dev` jac binary the runner uses
# (jac-dev-linux-x86_64), which carries jaseci/jac#7420: the client bundler now
# emits the __jacJsx factory. v0.32.0 stable OMITS it -> "__jacJsx is not defined"
# blanks the app on rich/error renders (issue #7412). Matches jacBuilder's dev
# deploy; swap for a pinned release tag once a stable release ships the fix.
[dev]

[scale.kubernetes]
app_name = "jac-gpt-test"
namespace = "jac-gpt-test"
bundle_storage_class = "efs-sc"
# Generates the users.acl secret key the redis pod mounts. WITHOUT this the pod
# fails: 'redis-acl references non-existent secret key: users.acl' -> redis never
# rolls out -> the deploy times out. (jacBuilder sets the same.)
redis_username = "default"
liveness_initial_delay = 600
liveness_period = 30
liveness_failure_threshold = 10
readiness_initial_delay = 600
readiness_period = 30
cpu_request = "1000m"
cpu_limit = "3000m"
memory_request = "2Gi"
memory_limit = "6Gi"
ephemeral_storage_request = "20Gi"
ephemeral_storage_limit = "30Gi"

[scale.secrets]
OPENAI_API_KEY = "${OPENAI_API_KEY}"
# Fix B -- jac-scale single-app deploy() ordering bug workaround.
# The single-app deploy() finalizes the app container env BEFORE it appends the DB
# URIs: kubernetes_target.jac builds the container (~L1041), _deploy_databases
# appends MONGODB_URI/REDIS_URL to env_list (~L1119), then the Deployment is created
# (~L1128) -- too late. So the pod never receives MONGODB_URI and jac-scale silently
# falls back to per-pod SQLite for identity/graph -> login 401 + "User not found" 500
# across the 3 replicas. [scale.secrets] is baked into the app's envFrom secret BEFORE
# the container is built, so passing the URIs here reaches the pod correctly. The
# values are resolved from the mongo/redis secrets jac-scale already created, in the
# deploy.yml "Resolve MongoDB/Redis URIs" step. Drop this once jac-scale reorders the
# single-app deploy to run _deploy_databases before building the container.
MONGODB_URI = "${MONGODB_URI}"
REDIS_URL = "${REDIS_URL}"

# Data backend (matches jacBuilder). backend=mongo -> data.mongo (pymongo);
# type=redis -> data.redis. redis_memory_limit=1Gi per jaseci#7307: the 256Mi
# default OOMKills redis (200mb maxmemory + RSS overhead).
[scale.database]
backend = "mongo"
type = "redis"
redis_memory_limit = "1Gi"

# byLLM / `by llm()` capability. Without this, litellm is NOT installed and every
# chat request 500s: "Capability 'llm' is required but not installed".
[byllm]

[byllm.parallel]
enabled = true

[jacpack]
name = "jac-gpt"
description = "Jac GPT fullstack template with chat interface"
jaclang = "0.9.0"
plugins = [{ name = "jac-client", version = "0.1.0" }]

[jacpack.options]
directories = [".jac"]
gitignore_entries = ["*"]
root_gitignore_entries = [".jac/"]
