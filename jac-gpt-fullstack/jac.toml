[project]
name = "jac-gpt-client"
version = "1.0.0"
description = "Jac client application: jac-gpt-client"
entry-point = "main.jac"

[dependencies]
python-dotenv = ">=0.0.0"
requests = ">=0.0.0"
langchain-openai = ">=0.0.0"
langchain-community = ">=0.0.0"
langchain-chroma = ">=0.0.0"
pypdf = ">=0.0.0"
sentence-transformers = ">=0.0.0"
faiss-cpu = ">=0.0.0"
numpy = "~=2.5"

[dependencies.npm]
jac-client-node = "1.0.7"
"@tanstack/react-form" = "^1.33.0"
react-markdown = "^9.0.0"
rehype-highlight = "^7.0.0"
"highlight.js" = "^11.9.0"
clsx = "^2.1.0"
tailwind-merge = "^2.2.0"
"@mantine/core" = "^7.15.0"
"@mantine/hooks" = "^7.15.0"
"@tabler/icons-react" = "^3.28.0"
"@emotion/react" = "^11.14.0"
react-error-boundary = "latest"
"@codemirror/view" = "^6.0.0"
"@codemirror/state" = "^6.0.0"
"@codemirror/language" = "^6.0.0"
"@lezer/highlight" = "^1.0.0"
monaco-textmate = "^3.0.1"
monaco-editor-textmate = "^4.0.0"

[dependencies.npm.dev]
"@jac-client/dev-deps" = "1.0.0"

[dev-dependencies]
watchdog = ">=3.0.0"

[serve]
base_route_app = "app"

[plugins.client]

[scale.kubernetes]
app_name = "jac-gpt-test"
namespace = "jac-gpt-test"
bundle_storage_class = "efs-sc"
liveness_initial_delay = 600
liveness_period = 30
liveness_failure_threshold = 10
readiness_initial_delay = 600
readiness_period = 30
cpu_request = "1000m"
cpu_limit = "3000m"
memory_request = "2Gi"
memory_limit = "6Gi"
ephemeral_storage_request = "20Gi"
ephemeral_storage_limit = "30Gi"

[scale.secrets]
OPENAI_API_KEY = "${OPENAI_API_KEY}"

[jacpack]
name = "jac-gpt"
description = "Jac GPT fullstack template with chat interface"
jaclang = "0.9.0"
plugins = [{ name = "jac-client", version = "0.1.0" }]

[jacpack.options]
directories = [".jac"]
gitignore_entries = ["*"]
root_gitignore_entries = [".jac/"]
