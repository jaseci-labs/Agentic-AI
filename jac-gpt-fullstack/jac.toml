[project]
name = "jac-gpt-client"
version = "1.0.0"
description = "Jac client application: jac-gpt-client"
entry-point = "main.jac"

[dependencies]
python-dotenv = ">=0.0.0"
requests = ">=0.0.0"
langchain-openai = ">=0.0.0"
langchain-community = ">=0.0.0"
langchain-chroma = ">=0.0.0"
pypdf = ">=0.0.0"
sentence-transformers = ">=0.0.0"
faiss-cpu = ">=0.0.0"

[dependencies.npm]
jac-client-node = "1.0.7"
react-markdown = "^9.0.0"
rehype-highlight = "^7.0.0"
"highlight.js" = "^11.9.0"
clsx = "^2.1.0"
tailwind-merge = "^2.2.0"
"@mantine/core" = "^7.15.0"
"@mantine/hooks" = "^7.15.0"
"@tabler/icons-react" = "^3.28.0"
"@emotion/react" = "^11.14.0"
react-error-boundary = "latest"

# CodeMirror 6 for Jac syntax highlighting
"@codemirror/view" = "^6.0.0"
"@codemirror/state" = "^6.0.0"
"@codemirror/language" = "^6.0.0"
"@lezer/highlight" = "^1.0.0"
"monaco-textmate" = "^3.0.1"
"monaco-editor-textmate" = "^4.0.0"

[dependencies.npm.dev]
"@jac-client/dev-deps" = "1.0.0"

[dev-dependencies]
watchdog = ">=3.0.0"

[serve]
base_route_app = "app"

[plugins.client]

[scale.kubernetes]
app_name = "jac-gpt-test"
namespace = "jac-gpt-test"
# New jac-scale deploy (jaseci#7084): the pod runtime is the downloaded jac
# binary, shipped to pods over a ReadWriteMany bundle PVC -- no source clone,
# no code-server, so the old ReadWriteOnce multi-attach failure is gone. The
# cluster default (gp3/EBS) is RWO and rejects RWX, so pin the bundle PVC to an
# RWX class. REQUIRES an RWX storage class named `efs-sc` on jaseci-cluster.
bundle_storage_class = "efs-sc"
# jac-scale (K-track) builds the app base image and pushes it here before
# deploying (EKS is remote; images can't be side-loaded). The deploy's OIDC
# role already carries ECR permissions. Interpolated from ECR_REGISTRY env.
image_registry = "${ECR_REGISTRY}"
liveness_initial_delay = 600
liveness_period = 30
liveness_failure_threshold = 10
readiness_initial_delay = 600
readiness_period = 30
# Resources — prevents BestEffort QoS and node eviction storms
# Peak observed: ~1000m CPU, ~2.3Gi RAM, ~3.6Gi ephemeral-storage during startup
cpu_request = "1000m"
cpu_limit = "3000m"
memory_request = "2Gi"
memory_limit = "6Gi"
ephemeral_storage_request = "20Gi"
ephemeral_storage_limit = "30Gi"

[scale.secrets]
OPENAI_API_KEY = "${OPENAI_API_KEY}"

# Jacpack metadata - used when packing, stripped from created projects
[jacpack]
name = "jac-gpt"
description = "Jac GPT fullstack template with chat interface"
jaclang = "0.9.0"

[[jacpack.plugins]]
name = "jac-client"
version = "0.1.0"

[jacpack.options]
directories = [".jac"]
gitignore_entries = ["*"]
root_gitignore_entries = [".jac/"]