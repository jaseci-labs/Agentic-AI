[project]
name = "jac-gpt-client"
version = "1.0.0"
description = "Jac client application: jac-gpt-client"
entry-point = "main.jac"

[dependencies]
python-dotenv = ">=0.0.0"
requests = ">=0.0.0"
langchain-openai = ">=0.0.0"
langchain-community = ">=0.0.0"
langchain-chroma = ">=0.0.0"
pypdf = ">=0.0.0"
sentence-transformers = ">=0.0.0"
faiss-cpu = ">=0.0.0"

[dependencies.npm]
jac-client-node = "1.0.7"
react-markdown = "^9.0.0"
rehype-highlight = "^7.0.0"
"highlight.js" = "^11.9.0"
clsx = "^2.1.0"
tailwind-merge = "^2.2.0"
"@mantine/core" = "^7.15.0"
"@mantine/hooks" = "^7.15.0"
"@tabler/icons-react" = "^3.28.0"
"@emotion/react" = "^11.14.0"
react-error-boundary = "latest"

# CodeMirror 6 for Jac syntax highlighting
"@codemirror/view" = "^6.0.0"
"@codemirror/state" = "^6.0.0"
"@codemirror/language" = "^6.0.0"
"@lezer/highlight" = "^1.0.0"
"monaco-textmate" = "^3.0.1"
"monaco-editor-textmate" = "^4.0.0"

[dependencies.npm.dev]
"@jac-client/dev-deps" = "1.0.0"

[dev-dependencies]
watchdog = ">=3.0.0"

[serve]
base_route_app = "app"

[plugins.client]

[plugins.scale.kubernetes]
app_name = "jac-gpt-test"
namespace = "jac-gpt-test"
# Pinned to jaseci-labs/jaseci b6cabe6 -- the merge of the byllm streaming
# cross-Context fix (#6604), on the PRE-FOLD multi-package layout this app
# requires. Do NOT bump to the folded/binary releases (v0.30+): this app
# imports top-level `byllm`, which was folded into `jaclang.byllm` and no
# longer exists there. Verified: this app + this runtime pass `jac check`.
# Keep jaseci_commit identical to deploy.yml.
jaseci_repo_url = "https://github.com/jaseci-labs/jaseci.git"
jaseci_branch = "main"
jaseci_commit = "b6cabe6668d0f98f9f7d9460e610e33d048a66bd"
liveness_initial_delay = 600
liveness_period = 30
liveness_failure_threshold = 10
readiness_initial_delay = 600
readiness_period = 30
# Resources — prevents BestEffort QoS and node eviction storms
# Peak observed: ~1000m CPU, ~2.3Gi RAM, ~3.6Gi ephemeral-storage during startup
cpu_request = "1000m"
cpu_limit = "3000m"
memory_request = "2Gi"
memory_limit = "6Gi"
ephemeral_storage_request = "20Gi"
ephemeral_storage_limit = "30Gi"

[plugins.scale.secrets]
OPENAI_API_KEY = "${OPENAI_API_KEY}"

# Jacpack metadata - used when packing, stripped from created projects
[jacpack]
name = "jac-gpt"
description = "Jac GPT fullstack template with chat interface"
jaclang = "0.9.0"

[[jacpack.plugins]]
name = "jac-client"
version = "0.1.0"

[jacpack.options]
directories = [".jac"]
gitignore_entries = ["*"]
root_gitignore_entries = [".jac/"]